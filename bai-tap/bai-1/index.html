<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <h2>CALCULATOR</h2>
        <div class="operator-number">
            <div>
                <label >Nhập số A:</label>
                <input type="number" id="numA">
            </div>
            <div>
                <label >Nhập số B:</label>
                <input type="number" id="numB">
            </div>
        </div>

        <div class="operator-button">
            <button onclick="up()">+</button>
            <button onclick="dow()">-</button>
            <button onclick="mul()">*</button>
            <button onclick="div()">/</button>
        </div>

        <p>Kết quả: <span id="result">0</span></p>
    </div>


    <script src="main.js"></script>
</body>
</html>
